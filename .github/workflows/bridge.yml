name: Telegram to Discord

on:
  schedule:
    # restart the realtime loop every 5 h (job runs ~5.5 h; the new dispatch
    # cancels-and-replaces the old one -> one live long-poll bridge)
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = realtime bridge | once = single pass | (anything else = single pass)"
        required: false
        default: "loop"
        type: choice
        options: [loop, once]
  repository_dispatch:
    types: [trigger-bridge]

concurrency:
  group: telegram-discord-bridge
  cancel-in-progress: true    # 5 h cron cancels-and-replaces the running loop

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # hard cap; script loop exits on its own at ~330 min
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -q requests
      - name: Run bridge
        run: |
          MODE="${{ inputs.mode || 'loop' }}"   # schedule & repository_dispatch -> loop
          if [ "$MODE" = "loop" ]; then
            python bridge.py --loop 330
          else
            python bridge.py
          fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}

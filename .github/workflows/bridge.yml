name: Telegram to Discord

on:
  schedule:
    # Berjalan setiap 5 menit dengan offset menit (2, 7, 12, 17, 22, dst.)
    # Menghindari antrean padat dan run yang ter-drop pada menit :00/:05 di GitHub Actions
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-bridge]

concurrency:
  group: telegram-discord-bridge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install requests
      - name: Run bridge
        run: python bridge.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}

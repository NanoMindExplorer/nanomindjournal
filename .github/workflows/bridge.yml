name: Telegram to Discord
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python bridge.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}
